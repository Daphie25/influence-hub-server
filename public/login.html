<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Influence Hub — вход</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --fg:#e8eaed; --muted:#8b93a1; --accent:#4fd1c5; --border:#2a2e38; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:360px;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:16px}
  h1{font-size:18px;margin:0 0 4px}
  p{color:var(--muted);font-size:13px;margin:0 0 20px}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:#11141a;color:var(--fg);font-size:14px;margin-bottom:12px}
  button{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#0a1a18;font-weight:600;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#f2645a;font-size:12.5px;margin:0 0 12px;min-height:16px}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Influence Hub</h1>
    <p>Общий доступ команды — введите пароль.</p>
    <div class="err" id="err"></div>
    <input type="password" id="pw" placeholder="Пароль" autofocus>
    <button type="submit" id="btn">Войти</button>
  </form>
  <script>
    var form = document.getElementById("loginForm");
    var btn = document.getElementById("btn");
    var err = document.getElementById("err");
    form.addEventListener("submit", function(e){
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Входим…"; err.textContent = "";
      fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ password: document.getElementById("pw").value }) })
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if (res.ok && res.j.ok) { location.href = "/"; }
          else { err.textContent = "Неверный пароль"; btn.disabled=false; btn.textContent="Войти"; }
        })
        .catch(function(){ err.textContent = "Сервер недоступен, попробуйте ещё раз"; btn.disabled=false; btn.textContent="Войти"; });
    });
  </script>
</body>
</html>
